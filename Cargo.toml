[package]
name = "mainsail"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "Batteries-included ActivityPub Library"
repository = "https://github.com/alexpetros/mainsail"
readme = "README.md"

[lib]
name = "mainsail"
path = "src/lib.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio-util = { version = "0.7.15", features = ["rt"] }
rusqlite = { version = "0.37.0", features = ["bundled", "uuid"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
openssl = { version = "0.10", features = ["vendored"] }
chrono = "0.4.41"
chrono-tz = "0.10.3"
reqwest = "0.12.18"
rand = "0.8.5"
uuid = { version = "1.17.0", features = ["v4"] }
log = "0.4.27"
url = { version = "2.5.4", features = ["serde"] }
http = "1.3.1"
tower = "0.5.2"
http-body = "1.0.1"
urlencoding = "2.1.3"

[dev-dependencies]
wiremock = "0.6.3"
